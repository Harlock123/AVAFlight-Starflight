# Builds and tests AVAFlight, publishes self-contained single-file executables for Windows,
# Linux and macOS on both x64 and arm64, and smoke-tests each binary on its native platform (it must reach the main menu).
# Pushes to main refresh the rolling "latest" pre-release; a tag like v1.0.0 makes a proper release.
name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels an older run still in progress, so the rolling "latest"
# release can never be overwritten by an older build that finished later.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: Test (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test tests/AVAFlight.Tests -c Release

  publish:
    name: Publish ${{ matrix.rid }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest,   exe: AVAFlight.exe }
          - { rid: win-arm64,   os: windows-11-arm,   exe: AVAFlight.exe }
          - { rid: linux-x64,   os: ubuntu-latest,    exe: AVAFlight }
          - { rid: linux-arm64, os: ubuntu-24.04-arm, exe: AVAFlight }
          - { rid: osx-x64,     os: macos-15-intel,   exe: AVAFlight }
          - { rid: osx-arm64,   os: macos-latest,     exe: AVAFlight }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish single-file executable
        run: ./publish.sh ${{ matrix.rid }}

      - name: Check output is a single file
        run: |
          ls -la publish/${{ matrix.rid }}
          test "$(ls publish/${{ matrix.rid }} | wc -l)" -eq 1

      - name: Install Linux GUI runtime for smoke test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libice6 libsm6 libfontconfig1

      - name: Smoke test (must reach the main menu)
        env:
          AVAFLIGHT_HOME: ${{ runner.temp }}/avaflight-home
          AVAFLIGHT_SMOKE_FILE: ${{ runner.temp }}/smoke.txt
        run: |
          bin="publish/${{ matrix.rid }}/${{ matrix.exe }}"
          if [ "$RUNNER_OS" = "Linux" ]; then cmd=(xvfb-run -a "$bin" --smoke-test --mute); else cmd=("$bin" --smoke-test --mute); fi
          "${cmd[@]}" &
          pid=$!
          for i in $(seq 1 120); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then kill "$pid"; echo "::error::Timed out before reaching the main menu"; exit 1; fi
          wait "$pid"; code=$?
          echo "exit code: $code"
          cat "$AVAFLIGHT_SMOKE_FILE"
          test "$code" -eq 0
          grep -q AVAFLIGHT_SMOKE_OK "$AVAFLIGHT_SMOKE_FILE"

      - name: Package
        run: |
          cd publish/${{ matrix.rid }}
          cp ../../LICENSE ../../README.md .
          mkdir -p licenses && cp ../../licenses/* licenses/
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../../AVAFlight-${{ matrix.rid }}.zip . > /dev/null
          else
            tar -czf ../../AVAFlight-${{ matrix.rid }}.tar.gz .
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: AVAFlight-${{ matrix.rid }}
          path: AVAFlight-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    name: Release
    # Pushes to main refresh the rolling "latest" pre-release; a v* tag makes a proper release.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Retry GitHub API calls a few times: a transient error must not leave a half-done release.
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "attempt $i failed: $*" >&2; sleep $((i * 15)); done; return 1; }
          notes="Built automatically from ${GITHUB_SHA::7} on main. Unzip or untar and run AVAFlight (./AVAFlight on Linux and macOS, AVAFlight.exe on Windows)."
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            retry gh release create "$GITHUB_REF_NAME" dist/* --title "AVAFlight $GITHUB_REF_NAME" --generate-notes
          elif gh release view latest >/dev/null 2>&1; then
            # A rolling pre-release of the newest main build, updated in place and never deleted: replace the
            # files first (the old release stays usable if this fails), then move the tag, then the notes.
            retry gh release upload latest dist/* --clobber
            retry gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
            retry gh release edit latest --prerelease --target "$GITHUB_SHA" --title "Latest build (main)" --notes "$notes"
          else
            retry gh release create latest dist/* --prerelease --target "$GITHUB_SHA" \
              --title "Latest build (main)" --notes "$notes"
          fi
