# Builds and tests AVAFlight, publishes self-contained single-file executables for all four
# targets, and smoke-tests each binary on its native platform (it must reach the main menu).
# Pushing a tag like v1.0.0 also attaches the archives to a GitHub release.
name: Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: Test (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet test tests/AVAFlight.Tests -c Release

  publish:
    name: Publish ${{ matrix.rid }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   os: windows-latest, exe: AVAFlight.exe }
          - { rid: linux-x64, os: ubuntu-latest,  exe: AVAFlight }
          - { rid: osx-x64,   os: macos-15-intel, exe: AVAFlight }
          - { rid: osx-arm64, os: macos-latest,   exe: AVAFlight }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Publish single-file executable
        run: ./publish.sh ${{ matrix.rid }}

      - name: Check output is a single file
        run: |
          ls -la publish/${{ matrix.rid }}
          test "$(ls publish/${{ matrix.rid }} | wc -l)" -eq 1

      - name: Install Linux GUI runtime for smoke test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libice6 libsm6 libfontconfig1

      - name: Smoke test (must reach the main menu)
        env:
          AVAFLIGHT_HOME: ${{ runner.temp }}/avaflight-home
          AVAFLIGHT_SMOKE_FILE: ${{ runner.temp }}/smoke.txt
        run: |
          bin="publish/${{ matrix.rid }}/${{ matrix.exe }}"
          if [ "$RUNNER_OS" = "Linux" ]; then cmd=(xvfb-run -a "$bin" --smoke-test --mute); else cmd=("$bin" --smoke-test --mute); fi
          "${cmd[@]}" &
          pid=$!
          for i in $(seq 1 120); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then kill "$pid"; echo "::error::Timed out before reaching the main menu"; exit 1; fi
          wait "$pid"; code=$?
          echo "exit code: $code"
          cat "$AVAFLIGHT_SMOKE_FILE"
          test "$code" -eq 0
          grep -q AVAFLIGHT_SMOKE_OK "$AVAFLIGHT_SMOKE_FILE"

      - name: Package
        run: |
          cd publish/${{ matrix.rid }}
          cp ../../LICENSE ../../README.md .
          mkdir -p licenses && cp ../../licenses/* licenses/
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../../AVAFlight-${{ matrix.rid }}.zip . > /dev/null
          else
            tar -czf ../../AVAFlight-${{ matrix.rid }}.tar.gz .
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: AVAFlight-${{ matrix.rid }}
          path: AVAFlight-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
